<input type="file" [id]="inputId" (change)="onChange($event)">

@if (!file()) {
  <label [for]="inputId">+ attachment</label>
}

@if (file(); as selected) {
  <div class="fileinfo">{{ selected.name }}</div>
  <div class="spacer"></div>
  <button type="button" (click)="onDelete()">&times; delete</button>
}
