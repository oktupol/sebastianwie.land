@if (globalMessages.length) {
  <div class="gm-container">
    @for (message of globalMessages; track message; let i = $index) {
      <div [class]="message.type">
        <div>
          {{ message.message }}
        </div>
        <button type="button" (click)="remove(i)">&times;</button>
      </div>
    }
  </div>
}
